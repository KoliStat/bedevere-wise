<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedevere Wise — Embed</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/duck.ico" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        /* Content-sized, not viewport-pinned: the embed reports its own
           document-scroll height to the parent (see embedMessages.ts), and
           the parent grows the iframe to fit. Pinning the page to 100% (or
           even min-height:100%) would floor scrollHeight at the iframe's
           initial viewport height, leaving blank space below a short result.
           Collapse is prevented by per-section min-heights instead (the
           editor, the result panel, and the pre-mount loader each set one). */
        width: 100%;
        /* All scrolling is internal (CodeMirror, the spreadsheet's own rows,
           the chart's overflow), so the outer document must never show a
           scrollbar. */
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: #1a1b26;
        color: #c0caf5;
      }
      /* Avoid the dark-on-light flash before JS picks a theme: keep the
         loader neutral so neither theme reads as a flash. The real theme
         is applied synchronously by main.ts before mount. */
      html[data-theme="light"] body { background: #e1e2e7; color: #3760bf; }
      /* Content-sized like html/body so a short result hugs its height
         instead of inheriting the iframe's initial viewport height. */
      #embed-root { width: 100%; overflow: hidden; }
      .embed-loading {
        display: flex; align-items: center; justify-content: center;
        min-height: 200px; font-size: 13px;
      }
      .embed-loading::after {
        content: "";
        width: 14px; height: 14px; margin-left: 8px;
        border: 2px solid currentColor; border-top-color: transparent;
        border-radius: 50%;
        animation: embed-spin 0.9s linear infinite;
        opacity: 0.6;
      }
      @keyframes embed-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="embed-root">
      <div class="embed-loading">Loading</div>
    </div>
    <script type="module" src="/src/embed/main.ts"></script>
  </body>
</html>
